
name: E-Commerce SDET Automation Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-test-secret-do-not-use-in-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: |
          python -m app.database.init_db
          python -m app.database.migration_v3_orders

      - name: Start Flask API
        run: |
          python -c "from app import create_app; create_app().run(host='127.0.0.1', port=5000, debug=False)" > flask.log 2>&1 &
          echo $! > flask.pid

      - name: Wait for API health check
        run: |
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 1
          done

          cat flask.log
          exit 1

      - name: Run automated tests
        run: python -m pytest -v
